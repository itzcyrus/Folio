[workspace]
resolver = "2"
members = ["crates/machie-config", "crates/machie-db", "crates/machie-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Machie"]
repository = "https://github.com/OWNER/machie"

[workspace.dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

machie-config = { path = "crates/machie-config" }
machie-db = { path = "crates/machie-db" }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
